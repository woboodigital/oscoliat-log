<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<meta name="appid" content="__APPID__">
<meta name="theme-color" content="#12072a"><meta name="color-scheme" content="dark">
<meta property="og:type" content="website"><meta property="og:site_name" content="OscoMatik">
<meta property="og:title" content="__TITLE__"><meta property="og:description" content="__DESC__">
<meta property="og:image" content="__IMG__"><meta property="og:url" content="__ORIGIN__/oyun/__APPID__">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="__ORIGIN__/oyun/__APPID__">
<link rel="icon" href="/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
.gh{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cv{width:min(460px,100%);height:auto;border-radius:14px;border:1px solid var(--line)}
.gh>div{flex:1 1 280px;min-width:0}
.avg{display:flex;align-items:baseline;gap:10px;margin:14px 0}.avg b{font:800 3.4rem/1 var(--d);color:var(--gold)}
.act{display:flex;gap:8px;flex-wrap:wrap}
.pc{margin-bottom:12px}.ph2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sc{font:800 2.2rem/1 var(--d);color:var(--gold)}
.st{font-size:.8rem;color:var(--mut);margin-left:6px}.st.yarida{color:var(--bad)}.st.tekrar{color:var(--cy)}
.nt{white-space:pre-wrap;color:#e3dcf6;margin:10px 0}
.vt{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.vr{display:flex;gap:10px;align-items:center;flex:1 1 280px}.vr label{white-space:nowrap}.vr b{color:var(--gold)}
</style>
</head>
<body>
<a class="skip" href="#icerik">İçeriğe geç</a>
<div class="wrap">
<nav class="top"><a class="brand" href="/">Osco<span>Matik</span></a><div><a class="link" href="/#puan">← Tüm oyunlar</a></div></nav>
<main id="icerik"><div id="g"><p class="mut">Yükleniyor…</p></div></main>
<footer><div class="fr"><span>© Oscoliat · OscoMatik</span><span><a href="/">Ana sayfa</a><a href="/gizlilik">Gizlilik politikası</a><a href="/cerez">Çerez politikası</a></span></div></footer>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number.isInteger(n)?n:n.toFixed(1);
const TRG={Action:'Aksiyon',Adventure:'Macera',Casual:'Rahat',Indie:'Bağımsız',RPG:'Rol yapma',Simulation:'Simülasyon',Strategy:'Strateji',Sports:'Spor',Racing:'Yarış','Massively Multiplayer':'Çok oyunculu','Free To Play':'Ücretsiz','Early Access':'Erken erişim',Horror:'Korku',Puzzle:'Bulmaca',Platformer:'Platform','Co-op':'Co-op'};
const tg=g=>TRG[g]||g;
const STN={bitirdi:'Bitirdi',yarida:'Yarıda bıraktı',tekrar:'Tekrar oynanacak'};
const voted=()=>{try{return JSON.parse(localStorage.getItem('voted')||'[]')}catch{return[]}};
const markVoted=id=>{try{localStorage.setItem('voted',JSON.stringify([...voted(),id]))}catch{}};
const card=p=>`<article class="panel pc"><div class="ph2"><div><b>${esc(p.played_at)}</b><span class="st ${p.status}">${STN[p.status]||''}</span></div><div class="sc">${fmt(p.score)}</div></div>
${p.tags.length?`<div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
${p.note?`<p class="nt">${esc(p.note)}</p>`:''}
${p.video_url?`<p><a class="btn" href="${esc(p.video_url)}" target="_blank" rel="noopener">▶ Yayın kaydını izle</a></p>`:''}
<div class="vt"><span class="mut">${p.v_n?`İzleyici ortalaması <b>${fmt(p.v_avg)}</b> (${p.v_n} oy)`:'Henüz izleyici oyu yok'}</span>
${voted().includes(p.id)?'<span class="mut">Oyun kaydedildi, teşekkürler.</span>':`<span class="vr"><label>Sen kaç verirdin? <b>7</b></label><input type="range" min="0" max="10" step="0.5" value="7" aria-label="İzleyici puanı"><button type="button" data-v="${p.id}">Oy ver</button></span>`}</div></article>`;
async function main(){
  const id=+document.querySelector('meta[name=appid]').content;let d;
  try{const r=await fetch('/api/games/'+id);if(!r.ok)throw 0;d=await r.json()}
  catch{$('g').innerHTML='<h1>Oyun bulunamadı</h1><p class="mut">Bu oyun puan defterinde yok. <a href="/#puan">Tüm oyunlara dön</a></p>';return}
  const g=d.game;
  $('g').innerHTML=`<section class="gh">${g.image?`<img class="cv" src="${esc(g.image)}" alt="${esc(g.name)} kapak görseli" width="460" height="215">`:''}
  <div><h1>${esc(g.name)}</h1><p class="mut">${[g.developer,g.release,g.genres.map(tg).join(', ')].filter(Boolean).map(esc).join(' · ')}</p>
  <div class="avg"><b>${fmt(d.avg)}</b><span class="mut">/ 10 · ${d.plays.length} oynanış</span></div>
  <div class="act"><a class="btn" href="https://store.steampowered.com/app/${id}" target="_blank" rel="noopener">Steam'de gör</a><button id="cp" type="button">Bağlantıyı kopyala</button></div></div></section>
  <h2>Oynanışlar</h2><div id="pl">${d.plays.map(card).join('')}</div>
  ${d.lists.length?`<h2>Listeler</h2><div class="tags">${d.lists.map(l=>`<span>${esc(l)}</span>`).join('')}</div>`:''}`;
}
document.addEventListener('input',e=>{if(e.target.matches('.vr input')){const v=+e.target.value;e.target.style.setProperty('--p',v*10+'%');e.target.parentNode.querySelector('b').textContent=fmt(v)}});
document.addEventListener('click',async e=>{
  if(e.target.id==='cp'){const u=location.href;try{await navigator.clipboard.writeText(u);e.target.textContent='Kopyalandı ✓'}catch{prompt('Bağlantı:',u)}return}
  const b=e.target.closest('button[data-v]');if(!b)return;const id=+b.dataset.v;
  try{const r=await fetch('/api/plays/'+id+'/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score:+b.parentNode.querySelector('input').value})});
    const j=await r.json().catch(()=>({}));if(!r.ok&&!/zaten/.test(j.error||''))throw new Error(j.error||'Hata');markVoted(id);main()}
  catch(x){alert(x.message)}});
main();
</script>
</body>
</html>
