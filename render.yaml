services:
  - type: web
    name: oscoliat-log
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: TURSO_DATABASE_URL, sync: false }
      - { key: TURSO_AUTH_TOKEN, sync: false }
